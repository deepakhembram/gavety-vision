# Builds, tests and publishes the Gavety Vision images to Docker Hub AND GitHub Container Registry.
#
# One-time setup in the GitHub repo (Settings -> Secrets and variables -> Actions):
#   Variables : DOCKERHUB_NAMESPACE   (your Docker Hub user/org, e.g. gavety)
#   Secrets   : DOCKERHUB_USERNAME, DOCKERHUB_TOKEN   (Docker Hub -> Account settings -> Personal access tokens)
# GHCR needs nothing extra (uses the built-in GITHUB_TOKEN).
#
# Publish a release:  git tag v0.1.0 && git push origin v0.1.0
name: docker-publish
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.24" }
      - name: Go tests (core)
        working-directory: core
        run: go vet ./... && go test -race -count=1 ./...
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Worker tests (mock engine, no GPU needed)
        working-directory: worker
        run: |
          pip install -r requirements.txt pytest
          python -m pytest -q tests

  publish:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: gavety-vision-core
            context: core
            platforms: linux/amd64,linux/arm64     # arm64 = Raspberry Pi
          - name: gavety-ai-worker
            context: worker
            platforms: linux/amd64                  # CUDA PyTorch has no arm64 build
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ vars.DOCKERHUB_NAMESPACE }}/${{ matrix.name }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: ${{ matrix.platforms }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.ref_name }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
